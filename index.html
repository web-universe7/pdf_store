<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Book Store - Multiple Books</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">आमची डिजिटल पुस्तके (E-Books)</h1>

    <!-- Books Container -->
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Book 1 -->
        <div class="bg-white p-5 rounded-2xl shadow-xl text-center flex flex-col justify-between">
            <div>
                <img src="https://via.placeholder.com/200x250" alt="Book 1" class="mx-auto rounded-lg mb-4 object-cover w-full h-48">
                <h2 class="text-lg font-bold text-gray-800 mb-2">Advanced Data Analytics Guide</h2>
                <p class="text-gray-600 text-sm mb-4">डेटा अनालिटिक्स शिकण्यासाठी संपूर्ण मार्गदर्शक.</p>
            </div>
            <div>
                <div class="text-xl font-extrabold text-green-600 mb-4">₹1</div>
                <button onclick="buyBook('book-1')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition duration-300 shadow-md">
                    Buy Now
                </button>
            </div>
        </div>

        <!-- Book 2 -->
        <div class="bg-white p-5 rounded-2xl shadow-xl text-center flex flex-col justify-between">
            <div>
                <img src="https://via.placeholder.com/200x250" alt="Book 2" class="mx-auto rounded-lg mb-4 object-cover w-full h-48">
                <h2 class="text-lg font-bold text-gray-800 mb-2">Python & SQL Masterclass</h2>
                <p class="text-gray-600 text-sm mb-4">पायथन आणि एसक्यूएल बेसिक ते अडव्हान्स.</p>
            </div>
            <div>
                <div class="text-xl font-extrabold text-green-600 mb-4">₹1</div>
                <button onclick="buyBook('book-2')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition duration-300 shadow-md">
                    Buy Now
                </button>
            </div>
        </div>

        <!-- Book 3 -->
        <div class="bg-white p-5 rounded-2xl shadow-xl text-center flex flex-col justify-between">
            <div>
                <img src="https://via.placeholder.com/200x250" alt="Book 3" class="mx-auto rounded-lg mb-4 object-cover w-full h-48">
                <h2 class="text-lg font-bold text-gray-800 mb-2">Complete Excel & Power BI</h2>
                <p class="text-gray-600 text-sm mb-4">डेटा विजुअलायझेशन आणि एक्सेल रिपोर्ट्स.</p>
            </div>
            <div>
                <div class="text-xl font-extrabold text-green-600 mb-4">₹1</div>
                <button onclick="buyBook('book-3')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition duration-300 shadow-md">
                    Buy Now
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript for Payment Flow -->
    <script>
        const BACKEND_URL = "https://pdf-store-jlwh.onrender.com"; // तुमची Render युनायटेड URL येथे टाका

        async function buyBook(bookId) {
            try {
                // १. बॅकएंडकडून विशिष्ट पुस्तकाची ऑर्डर तयार करून घेणे
                const response = await fetch(`${BACKEND_URL}/api/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bookId: bookId })
                });
                const data = await response.json();

                if (!data.success) {
                    alert("ऑर्डर तयार करण्यात अडचण आली.");
                    return;
                }

                // २. Razorpay चेकआउट विंडो ओपन करणे
                var options = {
                    "key": "JJVVJI8zdTOsVTaMchTccXAb", // तुमची Razorpay Key ID
                    "amount": data.order.amount,
                    "currency": "INR",
                    "name": "PDF Book Store",
                    "description": data.bookTitle,
                    "order_id": data.order.id,
                    "handler": async function (response) {
                        // ३. पेमेंट झाल्यावर व्हेरिफाय करून योग्य ड्राईव्ह लिंक मागवणे
                        const verifyRes = await fetch(`${BACKEND_URL}/api/verify-payment`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_signature: response.razorpay_signature,
                                bookId: bookId
                            })
                        });

                        const verifyData = await verifyRes.json();
                        
                        if (verifyData.success) {
                            alert("पेमेंट यशस्वी! तुम्हाला आता तुमच्या पुस्तकाची डाऊनलोड लिंक मिळत आहे.");
                            window.location.href = verifyData.driveLink; 
                        } else {
                            alert("पेमेंट व्हेरिफिकेशन्स फेल झाले!");
                        }
                    },
                    "theme": { 
                        "color": "#2563EB" 
                    }
                };

                var rzp1 = new Razorpay(options);
                rzp1.open();

            } catch (error) {
                console.error("Error:", error);
                alert("सर्व्हरशी कनेक्ट करण्यात अडचण येत आहे.");
            }
        }
    </script>
</body>
</html>
